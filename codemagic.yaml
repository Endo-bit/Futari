workflows:
  ios-testflight:
    name: iOS TestFlight (Futari)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - futari_mobile_env
      vars:
        BUNDLE_ID: "com.futarimobile.app"
        XCODE_WORKSPACE: "ios/Futari.xcworkspace"
        XCODE_SCHEME: "Futari"
        # PostHog's *project* API key, which is write-only and designed to be
        # public: it is compiled into the .ipa that ships to the App Store, so
        # anyone with the app already has it. It sits here rather than in the
        # futari_mobile_env group only because the group needs the Codemagic UI
        # and this file does not. To move it there instead, add
        # EXPO_PUBLIC_POSTHOG_KEY to the group and delete this line.
        # Note this repo is public, so the key is a grep away rather than a
        # binary unpack away. The worst anyone can do with it is post junk
        # events into the project; it cannot read anything back.
        EXPO_PUBLIC_POSTHOG_KEY: "phc_u5FNmwdhqF7CDaB5rmQWgPAmmVg99VTfWXbwhrRFETi2"
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.futarimobile.app
    integrations:
      app_store_connect: futari_asc_key
    # No automatic trigger. .github/workflows/ios-build-submit.yml also builds
    # and submits on push to master, and two pipelines racing to upload meant
    # both computed the same CFBundleVersion and Apple rejected whichever
    # finished second. This one now runs only when started by hand from the
    # Codemagic UI. To make Codemagic the primary again, restore the block
    # below and remove the push trigger from the GitHub workflow instead.
    #
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: master
    #       include: true
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Prebuild native iOS project
        script: npx expo prebuild --platform ios --clean
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios
          LATEST=$(app-store-connect get-latest-build-number "$BUNDLE_ID")
          agvtool new-version -all $(($LATEST + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
