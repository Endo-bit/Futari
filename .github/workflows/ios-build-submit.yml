name: iOS build (local) and submit to TestFlight

on:
  workflow_dispatch: {}
  push:
    branches: [master]

jobs:
  build-and-submit:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner's default Xcode can be too old for some native SPM
      # dependencies (e.g. Clerk's iOS SDK requiring a newer Swift tools
      # version than the default Xcode ships). Pin the newest available
      # Xcode on the runner instead of relying on the default.
      - name: Select latest available Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Verify EAS auth
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # Runs entirely on this runner's own Xcode — does NOT use the EAS
      # cloud build queue, so it does not count against the EAS free-tier
      # monthly build quota. Code signing credentials are still fetched
      # from your Expo account (must be configured once via `eas credentials`).
      - name: Build iOS app locally (does not use EAS cloud build minutes)
        run: |
          eas build --local \
            --platform ios \
            --profile production \
            --non-interactive \
            --output ./build/Futari.ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_API_KEY }}

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: futari-ios-ipa
          path: build/Futari.ipa

      - name: Submit to App Store Connect (TestFlight)
        run: |
          eas submit \
            --platform ios \
            --path ./build/Futari.ipa \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
