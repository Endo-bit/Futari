name: iOS build (local) and submit to TestFlight

on:
  workflow_dispatch: {}
  push:
    branches: [master]

jobs:
  build-and-submit:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned deliberately to an exact version — do not change to
      # `latest-stable` without checking the note below.
      #
      # Too old fails: the runner's default (16.4) can't build Clerk's iOS SDK,
      # which needs a newer Swift tools version.
      #
      # Too new fails: Xcode 26.3 rejects expo-modules-jsi with
      #   'RuntimeScheduler' cannot be annotated with either
      #   SWIFT_RETURNS_RETAINED or SWIFT_RETURNS_UNRETAINED because it is not
      #   returning a SWIFT_SHARED_REFERENCE type
      # RuntimeScheduler.h does carry SWIFT_SHARED_REFERENCE, but on the class's
      # closing brace — after the constructors that use SWIFT_RETURNS_RETAINED.
      # 26.3's Swift interop resolves the attribute at the declaration, before
      # it has seen that, and errors. It is an upstream Expo issue with no
      # newer release to move to (expo 57.0.18 / expo-modules-jsi 57.0.6 are
      # the latest published). Revisit once Expo ships a fix.
      #
      # 26.2 is present on the macos-15 image and satisfies both ends.
      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Verify EAS auth
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # Runs entirely on this runner's own Xcode — does NOT use the EAS
      # cloud build queue, so it does not count against the EAS free-tier
      # monthly build quota. Code signing credentials are still fetched
      # from your Expo account (must be configured once via `eas credentials`).
      - name: Build iOS app locally (does not use EAS cloud build minutes)
        run: |
          eas build --local \
            --platform ios \
            --profile production \
            --non-interactive \
            --output ./build/Futari.ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_API_KEY }}

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: futari-ios-ipa
          path: build/Futari.ipa

      - name: Submit to App Store Connect (TestFlight)
        run: |
          eas submit \
            --platform ios \
            --path ./build/Futari.ipa \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
