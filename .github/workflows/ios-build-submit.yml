name: iOS build (local) and submit to TestFlight

on:
  workflow_dispatch: {}
  push:
    branches: [master]

jobs:
  build-and-submit:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Expo SDK 57 requires Xcode 26.4 or newer — anything older fails to build
      # expo-modules-jsi:
      #   'RuntimeScheduler' cannot be annotated with either SWIFT_RETURNS_RETAINED
      #   or SWIFT_RETURNS_UNRETAINED because it is not returning a
      #   SWIFT_SHARED_REFERENCE type
      # Its two constructors carry SWIFT_RETURNS_RETAINED, which Swift rejects on a
      # constructor. Swift 6.2.x (Xcode ≤ 26.3) makes that an error; 6.3.x (26.4+)
      # downgrades it to a warning and the build succeeds. Upstream:
      # expo/expo#49214 and #49426 — both closed with "upgrade to Xcode 26.4+".
      # Moving the annotation in the header does NOT help; Expo measured that.
      #
      # macos-15 only ships up to Xcode 26.3, which is why this job runs on
      # macos-26. Pinned to 26.4.1 — the documented floor — rather than the image
      # default (26.6), since this failure was itself caused by a newer toolchain
      # tightening a rule.
      - name: Select Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      # Record which toolchain actually built this. The Swift version is the thing
      # that decides the error above, and a build log otherwise gives no way to
      # tell what produced a failure.
      - name: Report the toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Verify EAS auth
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # Runs entirely on this runner's own Xcode — does NOT use the EAS
      # cloud build queue, so it does not count against the EAS free-tier
      # monthly build quota. Code signing credentials are still fetched
      # from your Expo account (must be configured once via `eas credentials`).
      - name: Build iOS app locally (does not use EAS cloud build minutes)
        run: |
          eas build --local \
            --platform ios \
            --profile production \
            --non-interactive \
            --output ./build/Futari.ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_API_KEY }}

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: futari-ios-ipa
          path: build/Futari.ipa

      # --no-wait: once the archive is handed to EAS Submit the rest happens on
      # Expo's servers, so blocking the runner on it buys nothing. Without it the
      # step polls until the job's 90-minute limit and the run is recorded as a
      # failure even when the submission went through — that is exactly what
      # happened on the first green build: TestFlight received 1.0.3 (build 40)
      # 24 minutes after GitHub had already cancelled the job.
      # Track a submission at the URL this step prints, or in App Store Connect.
      - name: Submit to App Store Connect (TestFlight)
        run: |
          eas submit \
            --platform ios \
            --path ./build/Futari.ipa \
            --non-interactive \
            --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
